# Local data plane for teletype (Postgres + Redis).
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: teletype-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teletype
      POSTGRES_PASSWORD: teletype
      POSTGRES_DB: teletype
    ports:
      - "5432:5432"
    volumes:
      - teletype_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teletype -d teletype"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teletype-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - teletype_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teletype_pg_data:
  teletype_redis_data:
