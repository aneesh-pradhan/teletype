name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Include enough detail to reproduce on a clean guest session if possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps
      placeholder: |
        1. Open http://localhost:5173
        2. Select words / 25
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Typing engine
        - UI / themes
        - API / corpus
        - Auth / accounts
        - Leaderboards
        - Infra / CI
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, OS, commit SHA if known
      placeholder: "Firefox 140 / Ubuntu 26.04 / main@abc1234"
