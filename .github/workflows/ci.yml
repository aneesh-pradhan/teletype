name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @teletype/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  api-smoke:
    name: API smoke (build artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build API
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @teletype/shared build
          pnpm --filter @teletype/api build

      - name: Start API and hit /health
        run: |
          node apps/api/dist/index.js &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              kill $PID || true
              exit 0
            fi
            sleep 0.5
          done
          kill $PID || true
          echo "API did not become healthy"
          exit 1
